name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時デプロイを防ぐ
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm

      # google-sheets.ts がモジュールレベルで import するため、wrangler のバンドルに必須
      - name: Restore service account key
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > service-account-key.json
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Run D1 migrations
        run: pnpm exec wrangler d1 migrations apply pimu-kun-db --remote

      - name: Deploy
        run: pnpm exec wrangler deploy
